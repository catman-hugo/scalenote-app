# Builds installable test versions of the app on GitHub's machines.
# Run it by hand: Actions tab -> "Build test versions" -> Run workflow.
# Finished files appear at the bottom of the run page, under "Artifacts".
name: Build test versions

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

# The builds only need to read the code. They get no permission to change the repository.
permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux (deb, rpm, AppImage)
            os: ubuntu-22.04
            artifact: scalenote-linux
            files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
          - label: Windows (msi, exe)
            os: windows-latest
            artifact: scalenote-windows
            files: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  android:
    name: Android (apk)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # The runner already has the Android SDK, an NDK and several Java versions.
      # Tauri needs to be told which ones to use.
      - name: Point the build at the preinstalled Android tools
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - run: npm ci

      # The Android project is generated here instead of being stored in the repository.
      - run: npx tauri android init --ci

      # A debug build is signed with a throwaway debug key, so it installs for testing.
      # Release signing is added later with a real key kept in GitHub secrets.
      - run: npx tauri android build --apk --debug --target aarch64 --ci

      - uses: actions/upload-artifact@v4
        with:
          name: scalenote-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
