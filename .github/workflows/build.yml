# Builds installable test versions of the app on GitHub's machines.
# Run it by hand: Actions tab -> "Build test versions" -> Run workflow.
# Finished files appear at the bottom of the run page, under "Artifacts".
# Pushing a tag that starts with "v" (for example v0.0.1) also publishes the files
# on the repository's front page under "Releases".
name: Build test versions

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]

# The builds only need to read the code. They get no permission to change the repository.
permissions:
  contents: read

jobs:
  # Runs the automatic tests. Real devices are still needed for pen, touch and file pickers.
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Only the file-handling crate is tested here; it has no window or webview in it.
      - run: cargo test -p scalenote-core --locked
        working-directory: src-tauri
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/editor.spec.mjs

  desktop:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux (deb, rpm, AppImage)
            os: ubuntu-22.04
            artifact: scalenote-linux
            files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
          - label: Windows (msi, exe)
            os: windows-latest
            artifact: scalenote-windows
            files: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/portable/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - run: npm run tauri build

      # A portable Windows copy: just the program in a zip, no installer. It needs the
      # WebView2 runtime, which Windows 11 already has.
      - name: Make the portable Windows zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = node -p "require('./src-tauri/tauri.conf.json').version"
          New-Item -ItemType Directory -Force -Path src-tauri/target/release/bundle/portable | Out-Null
          Compress-Archive -Path src-tauri/target/release/scalenote.exe -DestinationPath "src-tauri/target/release/bundle/portable/ScaleNote_${version}_x64-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  android:
    name: Android (apk)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # The runner already has the Android SDK, an NDK and several Java versions.
      # Tauri needs to be told which ones to use.
      - name: Point the build at the preinstalled Android tools
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - run: npm ci

      # The Android project is generated here instead of being stored in the repository.
      - run: npx tauri android init --ci

      # A debug build is signed with a throwaway debug key, so it installs for testing.
      # Release signing is added later with a real key kept in GitHub secrets.
      - run: npx tauri android build --apk --debug --target aarch64 --ci

      # Gradle names the file app-universal-debug.apk. Rename it like the desktop
      # installers: product name, version from the app config, then the CPU type.
      - name: Name the APK like the other installers
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          mv "$apk" "$(dirname "$apk")/ScaleNote_${version}_arm64-debug.apk"
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk'

      - uses: actions/upload-artifact@v4
        with:
          name: scalenote-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # Only runs for tags. It is the one job allowed to write to the repository, and it
  # runs no project code: it only attaches the finished files to a release.
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: built
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The installer names contain spaces, so the list is built as a real array
          # (null-separated) instead of being split on spaces by the shell.
          mapfile -d '' files < <(find built -type f -print0)
          printf '%s\n' "${files[@]}"
          # A release made by hand on the website already exists by the time this runs,
          # so attach the files to it. Otherwise create the release first.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "ScaleNote ${GITHUB_REF_NAME#v} (test build)" \
              --notes "Test build for trying out on real devices. It is not a finished app. Install the file for your system: .msi or .exe for Windows, .deb for Linux Mint, .rpm for Fedora, .AppImage for any Linux, .apk for Android. Most of the code is written by AI and has not been human-reviewed, so keep backups." \
              "${files[@]}"
          fi
