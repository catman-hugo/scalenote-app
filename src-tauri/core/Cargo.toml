[package]
name = "scalenote-core"
version = "0.5.1"
description = "Vault logic with no window or web view in it, so it can be tested anywhere."
edition = "2021"
rust-version = "1.77"

# Only the standard library on purpose: every extra library is something that can
# change or break, and the vault code is the part that must never lose a note.
[dependencies]
# Both are already in the lock file through Tauri, so no new code is added to the build.
# sha2 gives the content hashes the sync compares (a vetted library, not hand-written code);
# getrandom gives the operating system's random numbers for the device id.
sha2 = "=0.10.9"
getrandom = "=0.3.4"
# Pairing and the encrypted connection between devices (0.5.1). All three are pinned and come
# from well-known security projects; no cryptography is written by hand here.
# snow: the Noise protocol (an encrypted, mutually authenticated connection with fixed keys).
# spake2: lets two devices prove they know the same short code without sending it.
# hmac: the confirmation tags that tie the code to both devices' keys.
snow = { version = "=0.10.0", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom", "std"] }
spake2 = "=0.4.0"
hmac = "=0.12.1"
zeroize = "=1.8.2"

[[bin]]
# Used only by the tests. It writes a note over and over so a test can kill it
# at a random moment and check the file is never half written.
name = "sn-crash-writer"
path = "src/bin/crash_writer.rs"
