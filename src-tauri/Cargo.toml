[package]
name = "scalenote"
version = "0.5.5"
description = "ScaleNote: a local-first markdown note app."
edition = "2021"
rust-version = "1.77"

[workspace]
members = [".", "core"]

[lib]
# The library name differs from the package name so the Android build can load it.
name = "scalenote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Exact versions (=) so a new release can never change the build by itself.
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
scalenote-core = { path = "core" }
serde = { version = "=1.0.229", features = ["derive"] }

# The system's secure storage for the sync key. Windows only for now (Credential Manager);
# other systems keep the key in a private file in the app's own folder (see src/secure.rs).
[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

# Writes the program into the computer's list of programs to start at login. Desktop only: there is
# no such list on Android. Exact version, like every dependency here.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "=2.7.0"
