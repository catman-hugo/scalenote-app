<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>ScaleNote</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="themes.css" />
  </head>
  <body>
    <div id="app" class="app">
      <aside id="sidebar" class="sidebar">
        <div class="side-head">
          <button id="vaultButton" type="button" class="vault-button" aria-haspopup="menu" aria-expanded="false">
            <img src="logo.png" class="logo" alt="" width="24" height="24" />
            <span id="vaultName" class="vault-name"></span>
          </button>
        </div>
        <div class="side-search">
          <button id="openSearch" type="button" class="search-button" aria-haspopup="dialog"></button>
        </div>
        <div class="side-actions">
          <button id="newNote" type="button"></button>
          <button id="newFolder" type="button"></button>
        </div>
        <div id="favorites" class="favorites" hidden></div>
        <nav id="tree" class="tree" aria-label="Notes"></nav>
        <div class="side-foot">
          <button id="openSettings" type="button" class="link-button"></button>
          <button id="openTags" type="button" class="link-button" aria-haspopup="dialog"></button>
          <button id="openTrash" type="button" class="link-button" aria-haspopup="dialog"></button>
          <a id="penTest" href="pentest.html"></a>
        </div>
      </aside>
      <div id="scrim" class="scrim"></div>

      <main class="main">
        <header class="topbar">
          <button id="toggle" type="button" class="icon-button"></button>
          <input id="title" class="title" type="text" maxlength="100" autocomplete="off" hidden />
          <button id="favorite" type="button" class="icon-button favorite-button" aria-pressed="false" hidden></button>
          <button id="historyButton" type="button" class="icon-button" aria-haspopup="dialog" hidden></button>
          <button id="sourceToggle" type="button" class="source-toggle" aria-pressed="false" hidden></button>
          <span id="status" class="status" role="status"></span>
        </header>
        <div id="banner" class="banner" role="alert" hidden>
          <span id="bannerText"></span>
          <button id="bannerClose" type="button" class="link-button"></button>
        </div>
        <div id="updateNotice" class="banner update-notice" role="status" hidden>
          <span id="updateText"></span>
          <button id="updateDownload" type="button"></button>
          <button id="updateDetails" type="button" class="link-button"></button>
          <button id="updateLater" type="button" class="link-button"></button>
        </div>
        <p id="empty" class="empty"></p>
        <div id="editor" class="editor" hidden></div>
        <textarea id="source" class="source" spellcheck="false" autocapitalize="off" autocomplete="off" hidden></textarea>
      </main>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>
    <dialog id="disclosure" class="dialog"></dialog>
    <dialog id="welcome" class="dialog"></dialog>
    <dialog id="settings" class="dialog"></dialog>
    <dialog id="whatsnew" class="dialog"></dialog>
    <dialog id="trash" class="dialog"></dialog>
    <dialog id="tags" class="dialog"></dialog>
    <dialog id="historyBox" class="dialog"></dialog>
    <dialog id="palette" class="dialog"></dialog>

    <script type="module" src="main.js"></script>
  </body>
</html>
